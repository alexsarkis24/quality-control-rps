{% extends "layout.html" %}
{% set active_page = "rps" %}
{% block title %}RPS Game{% endblock %}
{% block content %}
    <h1>Rock Paper Scissors</h1>
    <form action="/rps/results" method="POST" class="mt-3" style="max-width: 24rem;">
        <label for="user_choice" class="form-label">Choose your move:</label>
        <select id="user_choice" name="user_choice" class="form-select mb-3">
            {% for option in options %}
                <option value="{{ option }}">{{ option.title() }}</option>
            {% endfor %}
        </select>
        <button type="submit" class="btn btn-primary">Play</button>
    </form>
{% endblock %}
